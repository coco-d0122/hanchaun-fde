<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 瀚川工业园能耗异常定位智能体</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: #f5f7fa;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #24292f;
    }
    .card {
      width: 360px;
      background: #fff;
      border: 1px solid #e3e8ef;
      border-radius: 10px;
      padding: 36px 32px 28px;
      box-shadow: 0 4px 24px rgba(30, 111, 255, .06);
    }
    .brand { text-align: center; margin-bottom: 26px; }
    .brand h1 { font-size: 18px; letter-spacing: 1px; }
    .brand p { font-size: 12px; color: #6b7280; margin-top: 6px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 6px; }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e3e8ef;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    .field input:focus { outline: none; border-color: #1e6fff; }
    .btn {
      width: 100%;
      padding: 11px 0;
      background: #1e6fff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn:disabled { background: #a8c6ff; cursor: not-allowed; }
    .err {
      display: none;
      background: #fdf1f0;
      color: #d93026;
      border: 1px solid #f2c4c1;
      border-radius: 6px;
      font-size: 13px;
      padding: 8px 12px;
      margin-bottom: 14px;
    }
    .foot { font-size: 11px; color: #9aa3af; text-align: center; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>瀚川工业园</h1>
      <p>能耗异常定位智能体</p>
    </div>
    <div class="err" id="err"></div>
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>
    <button class="btn" id="btn">登 录</button>
    <div class="foot">模拟环境演示 · 初始账号由管理员 CLI 创建</div>
  </div>

  <script>
    "use strict";
    const errBox = document.getElementById("err");
    const btn = document.getElementById("btn");

    function showErr(msg) {
      errBox.textContent = msg;
      errBox.style.display = "block";
    }

    async function login() {
      errBox.style.display = "none";
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      if (!username || !password) { showErr("请输入用户名和密码"); return; }
      btn.disabled = true;
      try {
        const resp = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Requested-With": "XMLHttpRequest",   // CSRF 校验头
          },
          body: JSON.stringify({ username, password }),
        });
        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          showErr(data.message || "登录失败，请重试");
          return;
        }
        // 回跳到来源页（仅接受站内绝对路径，防开放重定向）
        const next = new URLSearchParams(location.search).get("next") || "";
        const target = (next.startsWith("/") && !next.startsWith("//")) ? next : "/";
        location.href = target;    // 登录成功
      } catch (e) {
        showErr("网络连接异常，请检查网络后重试");
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", login);
    document.getElementById("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });
  </script>
</body>
</html>
