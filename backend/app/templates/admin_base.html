<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}管理后台{% endblock %} · 瀚川工业园能耗智能体</title>
  <style>
    :root {
      --blue: #2563eb; --blue-dark: #1e40af;
      --bg: #f5f6f8; --panel: #ffffff; --border: #e2e5ea;
      --text: #1f2328; --text-2: #57606a; --danger: #dc2626; --ok: #16a34a;
      --warn: #d97706; --gray-bg: #f0f2f5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); font-size: 14px;
    }
    .layout { display: flex; min-height: 100vh; }
    /* ---- 左侧导航 ---- */
    .sidebar {
      width: 220px; background: #fff; border-right: 1px solid var(--border);
      flex-shrink: 0; display: flex; flex-direction: column;
    }
    .sidebar .brand {
      padding: 18px 16px; font-weight: 700; font-size: 15px;
      border-bottom: 1px solid var(--border); color: var(--blue-dark); line-height: 1.4;
    }
    .nav { padding: 10px 8px; flex: 1; }
    .nav a {
      display: block; padding: 9px 12px; border-radius: 6px;
      color: var(--text-2); text-decoration: none; margin-bottom: 2px;
    }
    .nav a:hover { background: var(--gray-bg); color: var(--text); }
    .nav a.active { background: #e8effc; color: var(--blue-dark); font-weight: 600; }
    .nav a.disabled { color: #9aa2ac; opacity: .5; }
    .sidebar .foot {
      padding: 12px 16px; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .sidebar .foot .user { color: var(--text-2); }
    .sidebar .foot a { color: var(--danger); text-decoration: none; font-size: 13px; }
    /* ---- 主区域 ---- */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      height: 52px; background: #fff; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 24px;
      justify-content: space-between;
    }
    .topbar h1 { font-size: 17px; font-weight: 600; }
    .content { padding: 24px; max-width: 1100px; }
    /* ---- 通用组件 ---- */
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-2); font-weight: 600; background: #fafbfc; font-size: 13px; }
    tr:hover td { background: #f8f9fb; }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; }
    .tag.published { background: #e6f6ec; color: var(--ok); }
    .tag.failed, .tag.needs_ocr { background: #fdf0e6; color: var(--warn); }
    .tag.processing { background: #e8effc; color: var(--blue-dark); }
    .tag.deleted { background: var(--gray-bg); color: var(--text-2); }
    .btn {
      border: 1px solid var(--border); background: #fff; color: var(--text);
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    .btn:hover { border-color: var(--blue); color: var(--blue); }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.primary:hover { background: var(--blue-dark); }
    .btn.danger { color: var(--danger); }
    .btn.danger:hover { border-color: var(--danger); }
    .btn.small { padding: 3px 10px; font-size: 12px; }
    .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; display: none; }
    .msg.ok { background: #e6f6ec; color: var(--ok); display: block; }
    .msg.err { background: #fdeaea; color: var(--danger); display: block; }
    input[type=file], input[type=text], select {
      border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 13px;
    }
    .hint { color: var(--text-2); font-size: 12.5px; line-height: 1.7; }
    .empty { text-align: center; color: var(--text-2); padding: 40px 0; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">瀚川工业园<br>能耗异常定位智能体</div>
      <nav class="nav">
        <a href="/">↩ 返回聊天</a>
        <a href="/admin/dashboard" {% if nav == 'dashboard' %}class="active"{% endif %}>工作台</a>
        <a href="/admin/users" {% if nav == 'users' %}class="active"{% endif %}>用户管理</a>
        <a href="/admin/kb" {% if nav == 'kb' %}class="active"{% endif %}>能源管理知识库</a>
        <a href="/admin/prompts" {% if nav == 'prompts' %}class="active"{% endif %}>AI 提示词管理</a>
        <a href="/admin/audit" {% if nav == 'audit' %}class="active"{% endif %}>AI 对话审计</a>
        <a href="/admin/anomalies" {% if nav == 'anomalies' %}class="active"{% endif %}>能耗异常事件</a>
        <a href="#" style="color:#9aa2ac" title="第五批交付">系统操作日志（待开放）</a>
      </nav>
      <div class="foot">
        <span class="user">{{ username }}</span>
        <a href="/api/auth/logout" id="lnk-logout">退出</a>
      </div>
    </aside>
    <div class="main">
      <div class="topbar"><h1>{% block pagetitle %}{% endblock %}</h1></div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
  {% block script %}
  <script>
    /* 退出登录：POST + CSRF 头（不能直接用 <a href> GET —— 登出也是写操作） */
    document.getElementById('lnk-logout').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/auth/logout', { method: 'POST', headers: { 'X-Requested-With': 'XMLHttpRequest' } });
      location.href = '/login';
    });
  </script>
  {% endblock %}
</body>
</html>
